name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    # Package without optional extras, on the lowest and the development Python.
    # NER and dashboard tests skip here (importorskip) and run in the `full` job.
    name: core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest  # offline: tests/conftest.py blocks sockets

  full:
    # All extras (torch, transformers, streamlit): strict mypy needs their types, and
    # the NER training smoke test and dashboard tests run instead of skipping.
    name: full (all extras, mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest
