[project]
name = "edgar-extract"
version = "0.1.0"
description = "SEC 10-K text-to-numbers extraction with a point-in-time fundamentals database"
authors = [
    { name = "Aryan Chadha", email = "achadha5@fordham.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "duckdb==1.5.6",
    "lxml==6.1.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pysbd==0.3.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "typer==0.27.2",
]

[project.optional-dependencies]
dashboard = [
    "plotly==7.1.0",
    "streamlit==1.65.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
edgar-extract = "edgar_extract.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
